name: Build Extension
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        geyser-build: ['1280', 'latest']
    env:
      GEYSER_VERSION: '2.12.1'
      GEYSER_BUILD: ${{ matrix.geyser-build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify Geyser
        run: python scripts/prepare_build.py
      - name: Compile and test
        run: mvn -B -ntp verify
      - name: Report tested upstream version
        run: cat .deps/compiled-geyser-version.txt
      - uses: actions/upload-artifact@v4
        if: matrix.geyser-build == 'latest'
        with:
          name: PatPatGeyserExtension
          path: |
            target/PatPatGeyserExtension-*.jar
            README.md
