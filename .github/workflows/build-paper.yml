name: Build PatPatVanilla Paper
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: paper-standalone/pom.xml
      - name: Build Paper plugin
        run: mvn --batch-mode --no-transfer-progress -f paper-standalone/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: PatPatVanilla-Paper
          path: paper-standalone/target/PatPatVanilla-*.jar
          if-no-files-found: error
