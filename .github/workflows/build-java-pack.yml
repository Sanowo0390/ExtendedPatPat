name: Build Java PatPat Resource Pack
on:
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image support
        run: python -m pip install Pillow==11.3.0
      - name: Build and validate Java resource pack
        run: python resourcepack/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PatPatJava-26.3-ResourcePack
          path: |
            resourcepack/dist/PatPatJava-26.3.zip
            resourcepack/dist/PatPatJava-26.3.zip.sha1
          if-no-files-found: error
