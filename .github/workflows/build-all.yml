name: Build PatPat (Velocity / Geyser / Paper)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 6'
permissions:
  contents: read
jobs:
  velocity:
    runs-on: ubuntu-latest
    env:
      PATPAT_DEFAULT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: velocity-standalone/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 json5==0.12.0
      - name: Embed default-only Java pack
        run: python resourcepack/build.py
      - name: Build and test Velocity
        run: mvn -B -ntp -f velocity-standalone/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: PatPatVelocity
          path: velocity-standalone/target/PatPatVelocity-*.jar
          if-no-files-found: error
  paper:
    runs-on: ubuntu-latest
    env:
      PATPAT_DEFAULT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: paper-standalone/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 json5==0.12.0
      - name: Embed default-only Java pack
        run: python resourcepack/build.py
      - name: Build Paper
        run: mvn -B -ntp -f paper-standalone/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: PatpatPaper
          path: paper-standalone/target/PatpatPaper-*.jar
          if-no-files-found: error
  geyser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        geyser-build: ['1280','latest']
    env:
      GEYSER_VERSION: '2.12.1'
      GEYSER_BUILD: ${{ matrix.geyser-build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Geyser API download
        run: python scripts/prepare_build.py
      - name: Build and test Geyser extension
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: matrix.geyser-build == 'latest'
        with:
          name: PatPatGeyserExtension
          path: target/PatPatGeyserExtension-*.jar
          if-no-files-found: error
