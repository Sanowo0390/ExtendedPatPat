name: Build ExtendedPatPat (Velocity / Geyser / Paper)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 6'
permissions:
  contents: read
jobs:
  velocity:
    runs-on: ubuntu-latest
    env:
      PATPAT_DEFAULT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: velocity-standalone/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 json5==0.12.0
      - name: Build map palette frames (default-only)
        run: python resourcepack/build.py
      - name: Build and test Velocity
        run: mvn -B -ntp -f velocity-standalone/pom.xml verify
      - name: Verify Velocity embeds map frames, without resource pack
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar,=Path('velocity-standalone/target').glob('ExtendedPatPat-Velocity-*.jar')
          with ZipFile(jar) as z:
              assert 'maps/default/0.bin' in z.namelist()
              assert len(z.read('maps/default/0.bin')) == 16384
              assert 'PatPatJava-26.3.zip' not in z.namelist()
              assert b'skins=default' in z.read('patpat-skins.properties')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ExtendedPatPat-Velocity
          path: velocity-standalone/target/ExtendedPatPat-Velocity-*.jar
          if-no-files-found: error
  paper:
    runs-on: ubuntu-latest
    env:
      PATPAT_DEFAULT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: paper-standalone/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 json5==0.12.0
      - name: Build map palette frames (default-only)
        run: python resourcepack/build.py
      - name: Build Paper
        run: mvn -B -ntp -f paper-standalone/pom.xml verify
      - name: Verify Paper embeds map frames, without resource pack
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar,=Path('paper-standalone/target').glob('ExtendedPatPat-Paper-*.jar')
          with ZipFile(jar) as z:
              assert 'maps/default/0.bin' in z.namelist()
              assert len(z.read('maps/default/0.bin')) == 16384
              assert 'PatPatJava-26.3.zip' not in z.namelist()
              assert b'skins=default' in z.read('patpat-skins.properties')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ExtendedPatPat-Paper
          path: paper-standalone/target/ExtendedPatPat-Paper-*.jar
          if-no-files-found: error
  geyser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        geyser-build: ['1280','latest']
    env:
      GEYSER_VERSION: '2.12.1'
      GEYSER_BUILD: ${{ matrix.geyser-build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Geyser API download
        run: python scripts/prepare_build.py
      - name: Build and test Geyser extension
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: matrix.geyser-build == 'latest'
        with:
          name: ExtendedPatPat-Geyser
          path: target/ExtendedPatPat-Geyser-*.jar
          if-no-files-found: error
