name: Build PatPatVelocity
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: velocity-standalone/pom.xml
      - name: Build Velocity plugin
        run: mvn -B -ntp -f velocity-standalone/pom.xml package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PatPatVelocity
          path: velocity-standalone/target/PatPatVelocity-*.jar
          if-no-files-found: error
