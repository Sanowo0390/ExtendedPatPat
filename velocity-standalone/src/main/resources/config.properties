# ExtendedPatPat Velocity 0.7.1: Proxy-only Java and Bedrock PatPat; Paper plugin not required.
# Requires a separately installed PacketEvents Velocity 2.14.0 plugin.
enabled=true
require-sneaking=true
cooldown-ms=250
max-distance=4.0
# Do not hijack vanilla interaction: the original interaction is forwarded.
cancel-interaction=false
# Java: 128x128 animated map in an invisible viewer-only item frame.
# No URL, resource pack or client mod is needed.
# The proxy generates five scale-aware vertical map poses per sprite frame at startup.
# Each map is transmitted at most once per viewer/connection.
# Viewer-only uniform scale pulse. Does NOT change server entity hitboxes.
squish-enabled=true
squish-min-scale=0.86
hand-enabled=true
# Renderer (resource-pack free; selected PER Java viewer):
#   item_frame   = original 128x128 map, fixed to four directions (default)
#   text_display = legacy experimental coloured text, visible font artifacts
#   head_tiles   = signed 8x8 player-head sprite billboards (Minecraft 1.21.9+).
#                  Requires generating & caching MineSkin tiles ONCE (see README).
# Missing tiles or unsupported client versions automatically fall back to item_frame.
# 0.6.9: transparent areas no longer use Braille placeholder glyphs;
# opaque cells use bold/underline to reduce the font grid.
# No resource pack is required in either mode.
# Text Display requires Java 1.19.4+; older clients use item_frame.
hand-renderer=item_frame
# Text-image resolution (8..32). Higher = more detail but more network traffic.
text-display-resolution=24
# Use 16, 24 or 32. Higher resolution means many more MineSkin requests.
head-tile-resolution=24
# Optional local-only MineSkin key; environment MINESKIN_API_KEY takes precedence.
# Do NOT publish this key. Used only by /extendedpatpat tiles generate [skin].
mineskin-api-key=
# Java and Geyser share coordinate conventions, but not visual scale/depth defaults.
# Java uses a map in a fixed ItemFrame, so sub-block placement is approximate.
# Velocity 0.6 is intentionally larger than Geyser's unchanged 0.5 default.
image-scale=0.6
# view: X toward the viewer, Z to the viewer's right; world: absolute X/Z.
offset-space=view
offset-x=0.5
offset-y=0.0
offset-z=0.0
# Same extra height as Geyser, for players riding a vehicle.
sitting-offset-y=0.2
# Geyser-style easing with a smaller Velocity-only stroke (Geyser remains 0.425).
# Motion depth is converted to map pixels once; it is not scaled twice.
hand-motion-enabled=true
hand-motion-depth=0.28
hand-motion-duration-ms=240
# 0 = duration of the sprite sheet (250ms for the built-in five-frame hand).
duration-ms=0
max-active=24
# Sounds use vanilla events; OGG is not sent by map pixels.
sound-enabled=true
sound-event=minecraft:block.wool.place
sound-volume=0.6
sound-pitch=1.0
# Blank = available to all; when set, requires the named Velocity permission.
required-permission=
# Bedrock-only rendering stays in the Geyser extension.
# Cross-edition: Geyser -> vanilla/Mod Java, Java -> Geyser.
# Requires ExtendedPatPat-Geyser 0.13.2 on the same Velocity instance.
# A queued Pat is dropped on server transfer or if a target disappears.
bridge-enabled=true

# DEFAULT: Proxy-only. No PatPat Plugin on the Paper/Purpur backend.
# Set true ONLY to opt into official PatPat Plugin authority.
official-integration-enabled=false
official-detection-ms=3000
# Never show unconfirmed effects when the backend may reject permission/list/rate/API.
official-local-preview=false
# Enable standalone rendering (default). Also fallback if optional official mode has no reply.
standalone-fallback=true
