# PatPatVelocity 0.1.0: Proxy-only Java Edition PatPat with Bedrock bridge.
# Requires a separately installed PacketEvents Velocity 2.14.0 plugin.
enabled=true
require-sneaking=true
cooldown-ms=250
max-distance=4.0
# Do not hijack vanilla interaction: the original interaction is forwarded.
cancel-interaction=false
# Six temporary BlockDisplay entities form a voxel hand. No resource pack is needed.
hand-enabled=true
hand-material=minecraft:pink_terracotta
hand-size=1.0
hand-offset-y=0.15
hand-depth=0.425
hand-duration-ticks=6
max-active=24
# A local vanilla sound for Java viewers.
sound-enabled=true
sound-event=minecraft:block.wool.place
sound-volume=0.6
sound-pitch=1.0
# Blank = available to all; when set, requires the named Velocity permission.
required-permission=
# Bedrock-only rendering stays in the Geyser extension.
bridge-enabled=true

# Official upstream PatPat Plugin (Paper/Purpur) has priority over local fallback.
# The proxy sends minecraft:register and v2 hello on behalf of vanilla Java users.
official-integration-enabled=true
official-detection-ms=3000
# Never show unconfirmed effects when the backend may reject permission/list/rate/API.
official-local-preview=false
# Only use independent rendering if no official PatPat Plugin answered.
standalone-fallback=true
