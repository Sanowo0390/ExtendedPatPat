# PatPatVelocity 0.1.2: Proxy-only Java and Bedrock PatPat; Paper plugin not required.
# Requires a separately installed PacketEvents Velocity 2.14.0 plugin.
enabled=true
require-sneaking=true
cooldown-ms=250
max-distance=4.0
# Do not hijack vanilla interaction: the original interaction is forwarded.
cancel-interaction=false
# Animated hand textures from resourcepack/PatPatJava-26.3.zip.
# resourcepack = one ItemDisplay with 5 animated PNG frames.
# auto = use resourcepack only when a pack was accepted; otherwise voxel.
# voxel = original six-block fallback.
hand-renderer=resourcepack
# To auto-offer the pack, host the ZIP at a public HTTPS URL.
# Empty URL means clients must install/enable the pack themselves.
resource-pack-url=
# 40-character hexadecimal SHA-1 of that ZIP (produced by build.py)
resource-pack-sha1=
resource-pack-assume-installed=false
# Viewer-only uniform scale pulse. Does NOT change server entity hitboxes.
squish-enabled=true
squish-min-scale=0.86
# Six temporary BlockDisplay entities remain available in voxel mode.
hand-enabled=true
hand-material=minecraft:pink_terracotta
hand-size=1.0
hand-offset-y=0.15
hand-depth=0.425
hand-duration-ticks=6
max-active=24
# A local vanilla sound for Java viewers.
sound-enabled=true
sound-event=minecraft:block.wool.place
sound-volume=0.6
sound-pitch=1.0
# Blank = available to all; when set, requires the named Velocity permission.
required-permission=
# Bedrock-only rendering stays in the Geyser extension.
bridge-enabled=true

# DEFAULT: Proxy-only. No PatPat Plugin on the Paper/Purpur backend.
# Set true ONLY to opt into official PatPat Plugin authority.
official-integration-enabled=false
official-detection-ms=3000
# Never show unconfirmed effects when the backend may reject permission/list/rate/API.
official-local-preview=false
# Enable standalone rendering (default). Also fallback if optional official mode has no reply.
standalone-fallback=true
