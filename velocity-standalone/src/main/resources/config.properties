# ExtendedPatPat Velocity 0.6.7: Proxy-only Java and Bedrock PatPat; Paper plugin not required.
# Requires a separately installed PacketEvents Velocity 2.14.0 plugin.
enabled=true
require-sneaking=true
cooldown-ms=250
max-distance=4.0
# Do not hijack vanilla interaction: the original interaction is forwarded.
cancel-interaction=false
# Java: 128x128 animated map in an invisible viewer-only item frame.
# No URL, resource pack or client mod is needed.
# The proxy generates five scale-aware vertical map poses per sprite frame at startup.
# Each map is transmitted at most once per viewer/connection.
# Viewer-only uniform scale pulse. Does NOT change server entity hitboxes.
squish-enabled=true
squish-min-scale=0.86
hand-enabled=true
# Java and Geyser share these position/scale numbers.
# Java uses a map in a fixed ItemFrame, so sub-block placement is approximate.
# 0.6 = 60% of the 1-block map sprite (same as Geyser).
image-scale=0.6
# view: X toward the viewer, Z to the viewer's right; world: absolute X/Z.
offset-space=view
offset-x=0.5
offset-y=0.0
offset-z=0.0
# Same extra height as Geyser, for players riding a vehicle.
sitting-offset-y=0.2
# Geyser's eased down-and-up stroke. Motion depth is converted to map pixels; it is not scaled twice.
hand-motion-enabled=true
hand-motion-depth=0.28
hand-motion-duration-ms=240
# 0 = duration of the sprite sheet (250ms for the built-in five-frame hand).
duration-ms=0
max-active=24
# Sounds use vanilla events; OGG is not sent by map pixels.
sound-enabled=true
sound-event=minecraft:block.wool.place
sound-volume=0.6
sound-pitch=1.0
# Blank = available to all; when set, requires the named Velocity permission.
required-permission=
# Bedrock-only rendering stays in the Geyser extension.
bridge-enabled=true

# DEFAULT: Proxy-only. No PatPat Plugin on the Paper/Purpur backend.
# Set true ONLY to opt into official PatPat Plugin authority.
official-integration-enabled=false
official-detection-ms=3000
# Never show unconfirmed effects when the backend may reject permission/list/rate/API.
official-local-preview=false
# Enable standalone rendering (default). Also fallback if optional official mode has no reply.
standalone-fallback=true
