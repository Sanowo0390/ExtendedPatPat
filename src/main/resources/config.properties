# ======================================================================
# ExtendedPatPat Geyser | Config Layout v2
# Geyser-Velocity 2.12.1系（b1280～、起動時にAPI互換性を検査）
#
# true  = ON   /  false = OFF
# ms    = milliseconds (1000ms = 1 second)
# block = Minecraft block units
#
# Changes can usually be applied with /extendedpatpatgeyser reload.
# Entries marked [RESTART] need a Velocity restart and Bedrock reconnect.
#
# Fresh installation only. Previous configuration formats are not migrated.
# ======================================================================


# ----------------------------------------------------------------------
# 01. 基本設定・対象の制限
# ----------------------------------------------------------------------

# 拡張機能の有効/無効
enabled=true

# 必要なVelocity側の権限。空欄なら追加の権限は不要
required-permission=

# プレイヤーを撫でられるようにする
allow-players=true

# 対象から除外するモブ（カンマ区切り）
# 例: minecraft:creeper,minecraft:warden
ignored-entity-types=

# 対象から除外するプレイヤーのUUID（カンマ区切り）
ignored-player-uuids=


# ----------------------------------------------------------------------
# 02. 撫でる操作
# ----------------------------------------------------------------------

# しゃがんでいる時だけPatを認める
require-sneaking=true

# メインハンドが空の時だけPatを認める
require-empty-hand=true

# 最大距離（ブロック）
max-distance=3.0

# 連続Patの最小間隔（ms）
cooldown-ms=100

# Pat時に左クリックと同じ腕振りを表示（ダメージなし）
swing-hand-enabled=true


# ----------------------------------------------------------------------
# 03. PatPat本体との連携
# ----------------------------------------------------------------------

# バックエンドのPatPatプラグインがなくても統合版で動かす
standalone-mode=true

# サーバー応答前に自分の画面へ手を先行表示する
local-preview=true


# ----------------------------------------------------------------------
# 04. 画像・リソースパック [RESTART]
# ----------------------------------------------------------------------

# 統合版向けリソースパックを自動配布
auto-pack=true

# image = PNG/GIF  /  glyph = 文字
renderer=image

# 拡張機能のデータフォルダからの相対パス
# 既定は560x112pxの5コマ横並びPNGです
image-file=images/hand.png

# 横一列のPNGを分割するコマ数（各コマが正方形の場合のみ）
# GIFや普通のPNGは従来どおり読み込みます
image-sprite-columns=5

# スプライトシート1コマの表示時間（ms）
# 既定50ms x 5コマ = 250ms（手の上下動240msに近い長さ）
image-sprite-frame-ms=50

# 手の画像サイズ。手の動きにも影響するため変更後は再起動
image-scale=0.5

# GIFを繰り返すか
image-loop=true


# ----------------------------------------------------------------------
# 05. 手の位置・上下の動き
# ----------------------------------------------------------------------

# offset-space=view : X=見る人の方向、Z=見る人の右
# offset-space=world: ワールド座標のX/Zに固定
# ※ 当たり判定による自動的な手前補正は行いません
offset-space=view

# 手の位置（ブロック）。手前に移す場合は offset-x を手動調整
offset-x=0.5
offset-y=0.0
offset-z=0.0

# 座っているプレイヤーの頭上に追加する高さ（ブロック）
sitting-offset-y=0.2

# 手を一度下げ、元の位置に戻す [RESTART for image renderer]
hand-motion-enabled=true

# 手を下げる深さ（ブロック）[RESTART for image renderer]
hand-motion-depth=0.425

# 上下アニメーションの時間（ms）[RESTART for image renderer]
# Squishと合わせるには240ms推奨
hand-motion-duration-ms=240


# ----------------------------------------------------------------------
# 06. Squish（モブ/プレイヤーが一瞬凹む演出）
# ----------------------------------------------------------------------

# [RESTART] リソースパックにはSquishが含まれます
squish-enabled=true


# ----------------------------------------------------------------------
# 07. 撫でられた側だけのカメラ演出
# ----------------------------------------------------------------------

# 他の人から撫でられた統合版プレイヤーにだけ適用します
# false推奨: カメラ操作系のプラグインとの併用時は無効が安全
camera-shake-enabled=false

# 縦方向へ軽く沈んで戻る最大量（ブロック）。
# 旧名との互換性のため「shake」というキー名を継続使用
camera-shake-intensity=0.06


# ----------------------------------------------------------------------
# 08. 効果音
# ----------------------------------------------------------------------

sound-enabled=true

# 複数のOGGからランダム再生するイベント
sound-event=patpatbedrock.pat

# 音量 (0.0 - 4.0)
sound-volume=1.0

# 音程 (0.1 - 4.0)
sound-pitch=1.0


# ----------------------------------------------------------------------
# 09. 表示時間・負荷・文字モード
# ----------------------------------------------------------------------

# 表示時間（ms）。0ならGIF 1周分（PNGは800ms）
duration-ms=0

# 1プレイヤーが同時表示できる最大の手の数
max-active-per-viewer=32

# glyphモードでの文字フレーム更新間隔（ms）
frame-ms=100

# glyphモードで使用するプライベートユニコード文字
frames=\uE2A0,\uE2A1,\uE2A2,\uE2A3
