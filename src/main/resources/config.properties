# Geyser 2.12.1-b1280 (64bb399). Restart proxy after changing auto-pack.
enabled=true
# Empty = no additional proxy permission needed. Backend PatPat restrictions apply when the backend is installed.
# To restrict, set e.g. patpatbedrock.use and grant it in Velocity's permission plugin.
required-permission=
auto-pack=true
require-sneaking=true
# Enable Bedrock-only PatPat when the backend plugin does not answer.
standalone-mode=true
require-empty-hand=true
allow-players=true
max-distance=3.0
cooldown-ms=100
# 0 = one full GIF cycle (PNG: 800 ms). Positive = fixed duration, optionally looped.
duration-ms=0
frame-ms=100
renderer=image
image-file=images/hand.gif
image-scale=0.5
image-loop=true
offset-x=0.5
offset-space=view
# view: X toward viewer, Y up/down, Z right/left. world: absolute X/Y/Z.
offset-y=0.0
offset-z=0.0
# Offset when the target player is mounted/sitting (e.g. GSit); positive moves the hand up.
sitting-offset-y=0.2
# Old config height-offset is used when offset-y is absent.
max-active-per-viewer=32
# Toggle on/off for individual Bedrock players: /patpatbedrock toggle [on|off].
# Personal preferences are persisted in disabled-players.txt.
# Like the Java client mod, the initiating client has no server acceptance acknowledgement.
# Set false to disable speculative local animation; observers still use server packets.
local-preview=true
frames=\uE2A0,\uE2A1,\uE2A2,\uE2A3

# Bedrock chooses a random sample from the three supplied sounds.
\n# Briefly squash the Bedrock model of a patted mob/player (resource pack required).\nsquish-enabled=true\nsound-enabled=true
sound-event=patpatbedrock.pat
sound-volume=1.0
sound-pitch=1.0
