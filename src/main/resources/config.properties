# Geyser 2.12.1-b1280 (64bb399). Restart proxy after changing auto-pack.
enabled=true
# Empty = no additional proxy permission needed. Backend PatPat restrictions still apply.
# To restrict, set e.g. patpatbedrock.use and grant it in Velocity's permission plugin.
required-permission=
auto-pack=true
require-sneaking=true
require-empty-hand=true
allow-players=true
max-distance=3.0
cooldown-ms=600
# 0 = one full GIF cycle (PNG: 800 ms). Positive = fixed duration, optionally looped.
duration-ms=0
frame-ms=100
renderer=image
image-file=images/hand.gif
image-scale=0.8
image-loop=true
offset-x=0.0
offset-space=view
# view: X toward viewer, Y up/down, Z right/left. world: absolute X/Y/Z.
offset-y=0.05
offset-z=0.0
# Old config height-offset is used when offset-y is absent.
max-active-per-viewer=32
# Like the Java client mod, the initiating client has no server acceptance acknowledgement.
# Set false to disable speculative local animation; observers still use server packets.
local-preview=true
frames=\uE2A0,\uE2A1,\uE2A2,\uE2A3
